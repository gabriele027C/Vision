name: vision-mobile CI

on:
  push:
    paths:
      - "vision-mobile/**"
      - ".github/workflows/vision-mobile-ci.yml"
  pull_request:
    paths:
      - "vision-mobile/**"
      - ".github/workflows/vision-mobile-ci.yml"

defaults:
  run:
    working-directory: vision-mobile

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vision-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck
