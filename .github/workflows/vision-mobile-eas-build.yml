name: vision-mobile EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - "vision-mobile-v*"

defaults:
  run:
    working-directory: vision-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vision-mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (Android)
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive
